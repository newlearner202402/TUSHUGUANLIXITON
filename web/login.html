<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 图书管理系统</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" id="loginForm" autocomplete="off">
      <h1 id="title">登录</h1>
      <p class="sub" id="subtitle">图书管理系统</p>

      <div id="msg"></div>

      <div class="field">
        <label for="username">学号 / 工号</label>
        <input id="username" autocomplete="off" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="new-password" required>
      </div>

      <button class="primary lg" type="submit" id="submitBtn" style="width:100%">登 录</button>

      <p class="muted small center mt" id="registerEntry">
        教师首次使用？<a href="/register.html">用邀请码注册</a>
      </p>
      <p class="muted small center"><a href="/">← 返回客户端选择</a></p>
    </form>
  </div>

  <script src="/shared/api.js"></script>
  <script>
    const CLIENT = new URLSearchParams(location.search).get('client') || 'student';

    const META = {
      teacher: { title: '教师端登录', sub: '图书检索 · 编目 · 借还办理' },
      student: { title: '学生端登录', sub: '馆藏检索 · 我的借阅 · 在线续借' },
    };

    const meta = META[CLIENT] || META.student;
    el('title').textContent = meta.title;
    el('subtitle').textContent = meta.sub;
    document.title = meta.title + ' - 图书管理系统';

    // 注册入口只对教师开放
    if (CLIENT !== 'teacher') el('registerEntry').classList.add('hidden');

    // 被顶下线时由 api.js 带着原因跳回来，在这里把原因显示出来，
    // 否则用户只会看到莫名其妙被丢回登录页。
    const kicked = new URLSearchParams(location.search).get('kicked');
    if (kicked) el('msg').innerHTML = '<div class="alert warn">' + esc(kicked) + '</div>';

    // 已经用匹配的角色登录过就直接进去
    if (getToken() && getUser()) {
      const allowed = CLIENT_ROLES[CLIENT] || [];
      if (allowed.includes(getUser().role)) location.replace('/' + CLIENT + '/');
    }

    el('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = el('submitBtn');
      btn.disabled = true;
      btn.textContent = '登录中…';
      el('msg').innerHTML = '';
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          auth: false,
          body: {
            username: el('username').value.trim(),
            password: el('password').value,
            client: CLIENT,
          },
        });
        saveSession(data);
        location.href = '/' + CLIENT + '/';
      } catch (err) {
        el('msg').innerHTML = '<div class="alert err">' + esc(err.message) + '</div>';
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
