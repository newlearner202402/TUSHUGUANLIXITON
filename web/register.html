<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师注册 - 图书管理系统</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" id="registerForm" style="max-width:440px">
      <h1>教师注册</h1>
      <p class="sub">凭管理员发放的邀请码开通教师账号</p>

      <div id="msg"></div>

      <div class="field">
        <label for="invite_code">邀请码 *</label>
        <input id="invite_code" placeholder="例如 7K2M9QX4B8TP" autocomplete="off" required autofocus
               style="text-transform:uppercase;letter-spacing:1px">
      </div>
      <div class="field">
        <label for="username">工号（登录账号）*</label>
        <input id="username" placeholder="例如 T1003" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="real_name">姓名 *</label>
        <input id="real_name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="dept">院系 / 部门</label>
        <input id="dept" placeholder="例如 计算机学院">
      </div>
      <div class="field">
        <label for="phone">手机号</label>
        <input id="phone" autocomplete="tel">
      </div>
      <div class="field">
        <label for="password">密码（至少 6 位）*</label>
        <input id="password" type="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="password2">确认密码 *</label>
        <input id="password2" type="password" autocomplete="new-password" required>
      </div>

      <button class="primary lg" type="submit" id="submitBtn" style="width:100%">注 册</button>

      <p class="muted small center mt">注册成功后自动登录教师端。教师可借 10 册，借期 60 天。</p>
      <p class="muted small center"><a href="/login.html?client=teacher">已有账号？去登录</a></p>
      <p class="muted small center"><a href="/">← 返回客户端选择</a></p>
    </form>
  </div>

  <script src="/shared/api.js"></script>
  <script>
    // 已经登录过就不用再注册了
    if (getToken() && getUser() && getUser().role === 'teacher') {
      location.replace('/teacher/');
    }

    el('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = el('submitBtn');
      const code = el('invite_code').value.trim().toUpperCase();
      const password = el('password').value;
      const password2 = el('password2').value;

      if (!code) { showErr('请填写邀请码'); return; }
      if (!el('username').value.trim()) { showErr('请填写工号'); return; }
      if (!el('real_name').value.trim()) { showErr('请填写姓名'); return; }
      if (password.length < 6) { showErr('密码至少 6 位'); return; }
      if (password !== password2) { showErr('两次输入的密码不一致'); return; }

      btn.disabled = true;
      btn.textContent = '提交中…';
      el('msg').innerHTML = '';
      try {
        const data = await api('/auth/register', {
          method: 'POST',
          auth: false,
          body: {
            username: el('username').value.trim(),
            password,
            real_name: el('real_name').value.trim(),
            invite_code: code,
            dept: el('dept').value.trim() || null,
            phone: el('phone').value.trim() || null,
          },
        });
        saveSession(data);
        location.href = '/teacher/';
      } catch (err) {
        showErr(err.message);
        btn.disabled = false;
        btn.textContent = '注 册';
      }
    });

    function showErr(message) {
      el('msg').innerHTML = '<div class="alert err">' + esc(message) + '</div>';
    }
  </script>
</body>
</html>
